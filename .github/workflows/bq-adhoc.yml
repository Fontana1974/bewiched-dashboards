name: bq-adhoc

on:
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run adhoc BigQuery pull
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: python bq_adhoc.py
